server {
    listen 80;
    root /usr/share/nginx/html;

    # Runtime config file used by the SPA.
    location = /mas-admin/config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Compatibility for deployments where a reverse proxy forwards to "/".
    location = /config.js {
        return 302 /mas-admin/config.js;
    }

    # Compatibility for older/stale entrypoints that reference /assets/*.
    location /assets/ {
        alias /usr/share/nginx/html/mas-admin/assets/;
        try_files $uri =404;
    }

    location /mas-admin/ {
        try_files $uri $uri/ /mas-admin/index.html;
    }

    # Also serve the app at root for dedicated admin subdomains.
    location / {
        try_files $uri $uri/ /mas-admin/index.html;
    }
}
